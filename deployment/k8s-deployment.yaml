apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: churn-prediction
  template:
    metadata:
      labels:
        app: churn-prediction
    spec:
      containers:
        - name: churn-prediction
          image: churn-prediction:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000